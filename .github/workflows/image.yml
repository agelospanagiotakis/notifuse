name: Build image

# Builds the e-Pragma fork image on GitHub's amd64 runners and publishes it to GHCR.
#
# Why here and not on a laptop:
#   * `ubuntu-latest` is x86_64, so no emulation — an Apple-silicon build produced an
#     arm64 image that died on the server with "exec format error".
#   * the build needs several GB of space and ~30 GB of cache; a workstation filled up.
#   * GHCR accepts the workflow's own GITHUB_TOKEN, so no personal registry credentials
#     and no "denied: requested access to the resource is denied".
#
# Consumed by epragma-mailer/Dockerfile as
#   FROM ghcr.io/agelospanagiotakis/notifuse-epragma:vX.Y-el

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v41.0-el)'
        required: true

env:
  IMAGE: ghcr.io/agelospanagiotakis/notifuse-epragma

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: echo "name=${GITHUB_REF_NAME:-${{ inputs.tag }}}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          # --pull equivalent: always resolve the base image, matching what Coolify does.
          pull: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "Published \`${{ env.IMAGE }}:${{ steps.tag.outputs.name }}\` (linux/amd64)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Point the deployment at it:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "FROM ${{ env.IMAGE }}:${{ steps.tag.outputs.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "This build contains the BSL-1.1 licensed work; /licenses is inside the image." >> "$GITHUB_STEP_SUMMARY"
