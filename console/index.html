<!doctype html>
<!-- The console, localised: this deployment's UI and content are Greek. -->
<html lang="el">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!--
    noindex is deliberate, not an oversight. This is an authenticated console served to a
    handful of people; indexing it would publish a login page as the site's search result and
    offer a thin, duplicate-content URL for crawlers to pick up. The pages that should rank are
    the public campaign archive (/archive/<workspace>/) and the client's own site.
    Everything else in this head is here so that the page is still a complete, valid document
    when it is shared, previewed or audited.
  -->
  <meta name="robots" content="noindex, nofollow" />
  <meta name="description" content="Η πλατφόρμα newsletter της e-Pragma: δημιουργία, αποστολή και δημόσιο αρχείο καμπανιών, με έλεγχο παράδοσης και ελληνικά κείμενα." />

  <!-- The console answers on /console; / redirects here with a 307. Canonical names the real one. -->
  <link rel="canonical" href="https://newsletters.e-pragma.gr/console" />

  <!-- Icons. Absolute /console/ paths: this shell is served from /console and the SPA can be
       opened at any depth under it, so a root-relative or document-relative path would 404. -->
  <link rel="icon" type="image/svg+xml" href="/console/favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="/console/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/console/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/console/apple-touch-icon.png" />
  <link rel="manifest" href="/console/site.webmanifest" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="msapplication-TileColor" content="#da532c" />

  <title>e-Pragma newsletters</title>
  <style>
    body {
      margin: 0;
    }

    .preload-splash {
      min-height: 100vh;
      /* background: linear-gradient(to right, #512DA8, #673AB7); */
      padding-bottom: 64px;
    }

    .preload-splash-logo {
      display: block;
      margin: 0 auto;
      padding: 64px 0;
      width: 150px;
    }

    .preload-splash-content {
      text-align: center;
    }

    .preload-icon {
      display: inline-block;
      color: inherit;
      font-style: normal;
      line-height: 0;
      text-align: center;
      text-transform: none;
      vertical-align: -0.125em;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      font-size: 60px;
    }

    .preload-icon-spin {
      display: inline-block;
      -webkit-animation: loadingCircle 1s infinite linear;
      animation: loadingCircle 1s infinite linear;
    }

    @keyframes loadingCircle {
      100% {
        -webkit-transform: rotate(360deg);
        transform: rotate(360deg);
      }
    }
  </style>
  <script>
    // Load config.js with cache-busting to ensure fresh configuration after setup
    document.write('<script src="/config.js?_t=' + Date.now() + '"><\/script>');
  </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="e-Pragma newsletters" />
    <meta property="og:locale" content="el_GR" />
    <meta property="og:title" content="e-Pragma newsletters" />
    <meta property="og:description" content="Η πλατφόρμα newsletter της e-Pragma: δημιουργία, αποστολή και δημόσιο αρχείο καμπανιών, με έλεγχο παράδοσης και ελληνικά κείμενα." />
    <meta property="og:url" content="https://newsletters.e-pragma.gr/console" />
    <!-- The console is served under /console, so the image is placed under it too. Pointing at
         /og-image.png looked tidier and was wrong: no root-level handler serves that path, so
         the request fell through to the /console redirect and answered a 3.7 KB HTML document
         where a 332 KB PNG was declared, and every link preview came back with no image. -->
    <meta property="og:image" content="https://newsletters.e-pragma.gr/console/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="e-Pragma newsletters — λογότυπο και τίτλος" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="e-Pragma newsletters" />
    <meta name="twitter:description" content="Η πλατφόρμα newsletter της e-Pragma: δημιουργία, αποστολή και δημόσιο αρχείο καμπανιών." />
    <meta name="twitter:image" content="https://newsletters.e-pragma.gr/console/og-image.png" />
    <meta name="twitter:image:alt" content="e-Pragma newsletters — λογότυπο και τίτλος" />
    <!-- No twitter:site: this account has no X handle, and pointing at a guessed one attributes
         the card to a stranger. Add it here the day there is one. -->

    <!-- Structured data: what the service is, who publishes it, in what language. Valid even on
         a noindex page — link unfurlers and other machines read it — and it costs one request:
         the application itself is client-rendered, so nothing here invents page content. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "e-Pragma newsletters",
        "url": "https://newsletters.e-pragma.gr/console",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "inLanguage": "el",
        "description": "Η πλατφόρμα newsletter της e-Pragma: δημιουργία, αποστολή και δημόσιο αρχείο καμπανιών, με έλεγχο παράδοσης και ελληνικά κείμενα.",
        "publisher": {
          "@type": "Organization",
          "name": "e-Pragma",
          "url": "https://www.e-pragma.gr"
        }
      }
    </script>
  </head>

<body>
  <div id="root">
    <div class="preload-splash">
      <img src="/logo.png" alt="Notifuse" class="preload-splash-logo">

      <div class="preload-splash-content">
        <i aria-label="icon: loading" class="preload-icon preload-icon-loading"><svg viewBox="0 0 1024 1024"
            class="preload-icon-spin" data-icon="loading" width="1em" height="1em" fill="#000000" aria-hidden="true"
            focusable="false">
            <path
              d="M988 548c-19.9 0-36-16.1-36-36 0-59.4-11.6-117-34.6-171.3a440.45 440.45 0 0 0-94.3-139.9 437.71 437.71 0 0 0-139.9-94.3C629 83.6 571.4 72 512 72c-19.9 0-36-16.1-36-36s16.1-36 36-36c69.1 0 136.2 13.5 199.3 40.3C772.3 66 827 103 874 150c47 47 83.9 101.8 109.7 162.7 26.7 63.1 40.2 130.2 40.2 199.3.1 19.9-16 36-35.9 36z">
            </path>
          </svg></i>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
